name: Build and verify Lite plugins
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache@v4
        with:
          path: .deps
          key: lite-dependencies-${{ hashFiles('tools/dependencies.json', 'tools/servers.json', 'tools/crossplay.json') }}
      - name: Build both JARs, test security behavior, compile both Paper API generations
        run: python3 tools/build.py all --test --compatibility
      - name: Start real Paper 1.21.11
        run: python3 tools/smoke.py --version 1.21.11
      - name: Start real Paper 26.3 with Geyser, Floodgate and the Simple bridge
        run: python3 tools/smoke.py --version 26.3 --crossplay
      - name: Record validation
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as E
          count = sum(int(E.parse(p).getroot().attrib.get('tests','0')) for p in pathlib.Path('build/test-results').glob('TEST-*.xml'))
          pathlib.Path('dist/VALIDATION-RESULTS.txt').write_text(f'PASS: {count} automated tests.\nPASS: real Paper API 1.21.11 and 26.3 compilation.\nPASS: Paper 1.21.11 startup/reload/ban/unban/persistence/shutdown.\nPASS: Paper 26.3 plus Geyser 2.12.1-1273, Floodgate 2.2.5-141 and SimpleSentinelBridge startup.\nNative Cumulus builder APIs were exercised. No real Java/Bedrock player session or deployment-specific proxy/LuckPerms setup was tested.\nFuture server/API versions require validation.\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Simple-Admin-Suite-Lite-1.0.0
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lite-validation-logs
          path: |
            build/test-results/
            build/smoke/**/smoke-console.log
